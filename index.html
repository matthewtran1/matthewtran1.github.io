<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matthew Tran Personal Portfolio</title>
    <script type="module" crossorigin src="/assets/index-f9c380e8.js"></script>
    <link rel="stylesheet" href="/assets/index-b252e9a8.css">
  </head>
  <body>
    <div id="root"></div>
    
    <script>
    window.addEventListener('load', function() {
      const sections = ['home', 'about', 'projects', 'contact'];
      const seen = new Set();

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && !seen.has(entry.target.id)) {
            seen.add(entry.target.id);
            window.goatcounter.count({
              path: `viewed-${entry.target.id}`,
              title: `Viewed section: ${entry.target.id}`,
              event: true,
            });
          }
        });
      }, { threshold: 0.5 });

      sections.forEach(id => {
        const el = document.getElementById(id);
        if (el) observer.observe(el);
      });
    });
  </script>
  </body>
</html>
